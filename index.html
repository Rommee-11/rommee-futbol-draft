<style>

/* ===== Pantallas nuevas: intro, menú, opciones, records, perfil ===== */
body { background: #031a2e; color: #fff; margin: 0; padding: 0; font-family: Arial, sans-serif; }
#fondo { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: -1; }

input[type=text] { font-size: 18px; padding: 8px; border-radius: 8px; border: none; width: 90%; }
.barra { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }

/* Logo en 3D */
#intro { cursor: pointer; }
.escena { height: 100vh; display: flex; align-items: center; justify-content: center; perspective: 900px; overflow: hidden; }
.logo { text-align: center; animation: logoAnim 5.6s ease-in-out forwards; }
.t1, .t2 { font-family: Impact, "Arial Black", sans-serif; font-weight: 900; margin: 0; background: linear-gradient(#fff 0%, #b5ecff 30%, #4cb9f0 70%, #2486c9 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 2px #0a2a5e;
  filter: drop-shadow(1px 1px 0 #0a2a5e) drop-shadow(2px 2px 0 #0a2a5e) drop-shadow(3px 3px 0 #0a2a5e) drop-shadow(4px 4px 0 #0a2a5e) drop-shadow(5px 5px 0 #0a2a5e) drop-shadow(0 12px 14px rgba(0,0,0,.6)); }
.t1 { font-size: clamp(56px, 19vw, 170px); letter-spacing: .04em; line-height: 1; }
.t2 { font-size: clamp(24px, 7.5vw, 64px); letter-spacing: .12em; margin-top: 6px; }
.mini .t1 { font-size: clamp(40px, 11vw, 86px); }
.mini .t2 { font-size: clamp(16px, 4.2vw, 34px); }
@keyframes logoAnim {
  0% { transform: translateZ(-900px) scale(.3) rotateX(18deg); opacity: 0; filter: blur(14px); }
  30% { transform: none; opacity: 1; filter: blur(0); }
  55% { transform: none; opacity: 1; filter: blur(0); }
  100% { transform: translateZ(-1100px) scale(.2); opacity: 0; filter: blur(18px); }
}

/* Menú */
#menu .cab { padding-top: 34px; animation: entra 1.2s; }
.botonera { margin-top: 26px; animation: entra 1.6s; }
@keyframes entra { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
.gb { display: block; width: min(88vw, 420px); margin: 12px auto; padding: 18px 10px; font-size: clamp(20px, 5.5vw, 28px); font-weight: bold; letter-spacing: .06em; color: #fff;
  background: linear-gradient(#45bff7, #1769b9); border: 3px solid #fff; border-radius: 18px; box-shadow: 0 6px 0 #0a2a5e, 0 12px 20px rgba(0,0,0,.45); text-shadow: 0 2px 0 #0a2a5e; cursor: pointer; transition: transform .12s, filter .12s; }
.gb:hover { filter: brightness(1.15); transform: scale(1.03); }
.gb:active { transform: translateY(4px); box-shadow: 0 2px 0 #0a2a5e; }
#chip { position: absolute; top: 10px; right: 10px; display: flex; align-items: center; gap: 8px; background: rgba(2,22,44,.8); color: #fff; border: 2px solid #8fdcff; border-radius: 30px; padding: 4px 14px 4px 6px; cursor: pointer; font-size: 16px; }
#chip .av { width: 40px; height: 48px; }

/* Avatares animados */
.av { display: block; }
.av .bob { animation: bob 2.2s ease-in-out infinite; }

@keyframes bob { 50% { transform: translateY(3px); } }

.fila { display: flex; flex-wrap: wrap; gap: 7px; }

.sw.sel, .ob.sel, .kit.sel { border-color: #ffd700; box-shadow: 0 0 0 3px rgba(255,215,0,.45); }

/* Records y ventana de fin */
details { margin: 6px 0; background: rgba(255,255,255,.07); border-radius: 10px; padding: 8px; }
summary { cursor: pointer; }
.modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.82); display: none; align-items: center; justify-content: center; z-index: 20; padding: 14px; }
.modal.visible { display: flex; }

#fin { padding: 0; background: radial-gradient(ellipse at 50% 30%, #3a2a6a, #0b0a1e 75%); }
#fin .finPanel { background: none; border: 0; box-shadow: none; max-width: none; position: relative; z-index: 2; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 14px; pointer-events: none; }

#finPuntos { font-size: clamp(48px, 10vw, 96px); font-weight: 900; line-height: 1; color: #fff; text-shadow: 0 4px 0 #1a7a2e, 0 0 30px rgba(120,255,150,.8); }

/* La cancha y las ruletas se leen mejor con un panel oscuro detrás */
#pantallaJuego #inicio, #pantallaJuego #juego { background: rgba(2,22,44,.55); border-radius: 18px; padding: 12px; max-width: 900px; margin: 0 auto; }

/* ===== Estadio: selector 3D, pantalla dividida y tabla ===== */
#presentacion { z-index: 25; }
#zonaRuleta { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: auto; z-index: 15; background: rgba(0,10,25,.84); overflow: auto; padding: 4vh 14px 14px; box-sizing: border-box; text-align: center; }
#zonaRuleta .panelRuleta { max-width: 420px; margin: 0 auto; }

#juego { flex-wrap: wrap; gap: 16px; justify-content: center; align-items: flex-start; max-width: 1150px; margin: 0 auto; }
#cancha { box-shadow: 0 0 40px rgba(60,200,120,.45), 0 0 0 4px #fff3; }
#total { font-size: 18px; font-weight: bold; margin: 0 0 8px 0; }

.colTabla { flex: 1 1 440px; min-width: 300px; max-width: 640px; text-align: left; }
#tablaDraft { background: linear-gradient(160deg, rgba(6,28,58,.93), rgba(3,14,30,.93)); border: 2px solid #8fdcff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.55), 0 0 0 4px rgba(10,42,94,.8); overflow: hidden; overflow-x: auto; }
.tdTit { padding: 12px 16px; font: 900 22px Impact, "Arial Black", sans-serif; letter-spacing: .14em; color: #fff; background: linear-gradient(90deg, #0a2a5e, #1769b9 60%, #0a2a5e); border-bottom: 3px solid #ffd700; text-shadow: 0 2px 0 #031a3a; }

.td tfoot td { padding: 10px 8px; font-weight: bold; font-size: 16px; background: linear-gradient(90deg, #0a2a5e, #1769b9); color: #fff; text-align: right; }
.ins { display: inline-block; min-width: 34px; text-align: center; padding: 3px 7px; border-radius: 8px; font-weight: bold; color: #222; }

/* Selector de formación en 3D */
#selFormacion { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 30; background: radial-gradient(circle, rgba(3,26,46,.86), rgba(0,0,0,.95)); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 10px; box-sizing: border-box; }
#selFormacion.visible { display: flex; }
.escena3d { width: min(96vw, 900px); height: min(46vh, 310px); perspective: 1100px; display: flex; align-items: center; justify-content: center; }
#cilindro { position: relative; width: 170px; height: 240px; transform-style: preserve-3d; }
.carta3d { position: absolute; left: 0; top: 0; width: 170px; height: 240px; border-radius: 14px; background: linear-gradient(#0e3a2a, #0a2a1e); border: 3px solid #8fdcff; box-shadow: 0 0 18px rgba(143,220,255,.5); backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; padding: 6px; box-sizing: border-box; }
.carta3d svg { width: 100%; height: 190px; }
.carta3d b { font-size: 24px; color: #fff; letter-spacing: .05em; }
#formNombre { font: 900 clamp(36px, 9vw, 60px) Impact, "Arial Black", sans-serif; color: #8fdcff; text-shadow: 0 4px 0 #0a2a5e; min-height: 1.1em; }
/* ===== Ruleta 3D en primer plano y pantalla del draft más grande ===== */
#zonaRuleta { --v: 0; --giro: 0deg; --cw: 260px; --chh: 360px; background: radial-gradient(circle at 50% 42%, rgba(12,70,46,.94), rgba(0,10,20,.97) 70%); animation: aparecer .5s; transition: opacity .8s; opacity: 1; padding-top: 5vh; }
#zonaRuleta.sale { opacity: 0; pointer-events: none; }
#zonaRuleta::before { content: ""; position: absolute; left: 50%; top: 46%; width: 78vmin; height: 78vmin; margin: -39vmin 0 0 -39vmin; border: 6px solid rgba(255,255,255,.10); border-radius: 50%; pointer-events: none; }
#zonaRuleta .panelRuleta { max-width: 1200px; position: relative; }
#balonFondo { position: absolute; left: 50%; top: 46%; font-size: 70vmin; line-height: 1; opacity: .07; transform: translate(-50%, -50%) rotate(var(--giro)); pointer-events: none; }
#estelas { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; opacity: var(--v); mix-blend-mode: screen;
  background: repeating-linear-gradient(90deg, transparent 0 36px, rgba(255,255,255,.10) 36px 40px, transparent 40px 96px), radial-gradient(circle at 50% 46%, transparent 20%, rgba(255,215,0,.16) 100%); }
#titulo { font: 900 clamp(26px, 5vw, 52px) "Palatino Linotype", "Book Antiqua", Georgia, serif; letter-spacing: .12em; text-transform: uppercase; margin: 4px 0 10px; color: #f3d27a; text-shadow: 0 4px 0 #3b2a00, 0 0 24px rgba(255,215,0,.35); }
#aviso { font-size: clamp(13px, 2vw, 18px); opacity: .9; margin: 0; }
#escenaReel { position: relative; width: min(98vw, 1100px); height: calc(var(--chh) * 1.22); margin: 0 auto 8px; perspective: 1500px; perspective-origin: 50% 45%; }
#cil3d { position: absolute; left: 50%; top: 50%; width: var(--cw); height: var(--chh); margin-left: calc(var(--cw) / -2); margin-top: calc(var(--chh) / -2); transform-style: preserve-3d; }
.cr { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--chh); border-radius: 20px; border: 4px solid #f3d27a; box-sizing: border-box; overflow: hidden; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4%; text-align: center; padding: 10px;
  filter: blur(calc(var(--v) * 4px)) brightness(calc(1 + var(--v) * .35)); box-shadow: 0 0 calc(12px + var(--v) * 50px) rgba(255,215,0,calc(.2 + var(--v) * .6)); }
.cr::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 14%, transparent 14% 28%); }
.cr .tp { position: relative; font: 700 calc(var(--cw) * .06) "Palatino Linotype", Georgia, serif; letter-spacing: .28em; white-space: nowrap; color: #f3d27a; text-transform: uppercase; }

.cr .nm { position: relative; font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; line-height: 1.1; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.5); word-break: keep-all; overflow-wrap: normal; hyphens: none; max-width: 100%; }

#ventanaReel { position: absolute; left: 50%; top: 50%; width: calc(var(--cw) + 34px); height: calc(var(--chh) + 34px); margin-left: calc((var(--cw) + 34px) / -2); margin-top: calc((var(--chh) + 34px) / -2); border: 5px solid #ffd700; border-radius: 28px; pointer-events: none; box-shadow: 0 0 40px rgba(255,215,0,.45), inset 0 0 30px rgba(255,215,0,.25); }
#botonGirar { font: 900 clamp(20px, 3vw, 30px) "Palatino Linotype", Georgia, serif; letter-spacing: .14em; padding: 14px 64px; border-radius: 40px; background: linear-gradient(#ffe680, #ffd700); border: 3px solid #fff; box-shadow: 0 6px 0 #8a6a00, 0 10px 24px rgba(0,0,0,.5); }

#juego.crece { animation: crece 1s cubic-bezier(.2,.8,.2,1); }
@keyframes crece { 0% { transform: scale(.8); opacity: .35; filter: blur(4px); } 100% { transform: scale(1); opacity: 1; filter: none; } }
#cancha { width: min(94vw, calc(min(82vh, 780px) * .74)); height: auto; aspect-ratio: 37 / 50; border: 0; border-radius: 14px; background: #07120b; overflow: visible; box-shadow: 0 0 40px rgba(60,200,120,.35), 0 10px 30px rgba(0,0,0,.6); }

#cancha .puesto svg.cam { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 4px 3px rgba(0,0,0,.55)); transition: transform .15s; }

.colCancha { flex: 0 0 auto; }

/* ===== Patada y barra de fuerza ===== */

<script>
    // Nombres de cada puesto
    const POS = { ARQ: "Arquero", LD: "Lateral derecho", LI: "Lateral izquierdo", DFC: "Defensor central", MCD: "Medio defensivo",
      MC: "Mediocampista central", MCO: "Medio ofensivo", MD: "Mediocampista derecho", MI: "Mediocampista izquierdo",
      ED: "Extremo derecho", EI: "Extremo izquierdo", DC: "Delantero centro" };

    // Formaciones: cada lugar es [puesto, x%, y%] sobre la cancha
    const D = [["ARQ",50,91],["LD",87,72],["DFC",63,75],["DFC",37,75],["LI",13,72]];
    const FORMACIONES = {
      "4-4-2": D.concat([["MD",87,47],["MC",63,50],["MC",37,50],["MI",13,47],["DC",65,17],["DC",35,17]]),
      "4-3-3": D.concat([["MC",24,48],["MCD",50,56],["MC",76,48],["EI",15,20],["DC",50,14],["ED",85,20]]),
      "4-1-2-1-2": D.concat([["MCD",50,59],["MC",27,46],["MC",73,46],["MCO",50,33],["DC",64,15],["DC",36,15]]),
      "4-3-1-2": D.concat([["MC",25,50],["MCD",50,58],["MC",75,50],["MCO",50,34],["DC",64,15],["DC",36,15]]),
      "4-4-1-1": D.concat([["MD",87,47],["MC",63,51],["MC",37,51],["MI",13,47],["MCO",50,32],["DC",50,14]]),
      "4-2-3-1": D.concat([["MCD",64,58],["MCD",36,58],["EI",15,36],["MCO",50,35],["ED",85,36],["DC",50,14]]),
      "3-5-2": [["ARQ",50,91],["DFC",25,76],["DFC",50,79],["DFC",75,76],["LI",10,54],["MC",30,47],["MCD",50,56],["MC",70,47],["LD",90,54],["DC",37,16],["DC",63,16]],
      "4-5-1": D.concat([["MI",12,45],["MC",32,50],["MCD",50,57],["MC",68,50],["MD",88,45],["DC",50,15]]),
      "5-3-2": [["ARQ",50,91],["LI",10,68],["DFC",28,76],["DFC",50,79],["DFC",72,76],["LD",90,68],["MC",30,47],["MCD",50,55],["MC",70,47],["DC",38,17],["DC",62,17]],
      "3-4-3": [["ARQ",50,91],["DFC",25,76],["DFC",50,79],["DFC",75,76],["LI",10,50],["MC",38,52],["MC",62,52],["LD",90,50],["EI",17,20],["DC",50,14],["ED",83,20]]
    };
    const NOMBRE_FASE = ["Liga", "Equipo", "Nacionalidad", "Jugador"];

    let slots = [], slotActivo = null, fase = 0, sel = {}, lista = [], girando = false, jugadorActual = null;

    function el(id) { return document.getElementById(id); }
    function edadTxt(j) { return j.edad ? j.edad + " " + TT[ajustes.idioma].anios : TT[ajustes.idioma].leyenda; }
    function sinRepetidos(l) { return l.filter(function (x, i) { return l.indexOf(x) === i; }); }

    for (const f in FORMACIONES) { el("selForm").add(new Option(f, f)); }

    function empezar() {
      slots = FORMACIONES[el("selForm").value].map(function (s) { return { pos: s[0], x: s[1], y: s[2], jugador: null }; });
      el("inicio").style.display = "none";
      el("juego").style.display = "flex";
      dibujarCancha();
    }

    // ===== Estadio visto desde arriba: gradas con público, carteles, césped con rayas y líneas reglamentarias =====
    let _estadio = "";
    function estadioSVG() {
      if (_estadio) { return _estadio; }
      const cols = ["#e63946", "#ffffff", "#ffd166", "#4cc9f0", "#f72585", "#80ed99", "#ff9f1c", "#9d4edd"];
      let gente = "";
      for (let i = 0; i < 70; i++) { gente += '<circle cx="' + (3 + (i % 10) * 4.3 + (Math.floor(i / 10) % 2) * 2) + '" cy="' + (2.5 + Math.floor(i / 10) * 4.2) + '" r="1.7" fill="' + cols[(i * 7 + Math.floor(i / 10) * 3) % cols.length] + '"/>'; }
      let rayas = "";
      for (let i = 0; i < 12; i++) { rayas += '<rect x="52" y="' + (55 + i * 32.5) + '" width="266" height="32.5" fill="' + (i % 2 ? "#2f8f3f" : "#37a24a") + '"/>'; }
      let carteles = "";
      const cc = ["#e63946", "#1d6fe0", "#ffd166", "#ffffff", "#2ec27e", "#ff9f1c"];
      for (let i = 0; i < 14; i++) { carteles += '<rect x="' + (45 + i * 20) + '" y="48" width="20" height="5" fill="' + cc[i % 6] + '"/><rect x="' + (45 + i * 20) + '" y="447" width="20" height="5" fill="' + cc[(i + 3) % 6] + '"/>'; }
      for (let i = 0; i < 20; i++) { carteles += '<rect x="46" y="' + (54 + i * 19.7) + '" width="5" height="19.7" fill="' + cc[(i + 1) % 6] + '"/><rect x="319" y="' + (54 + i * 19.7) + '" width="5" height="19.7" fill="' + cc[(i + 4) % 6] + '"/>'; }
      const L = 'fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"';
      _estadio = '<svg class="estadio" viewBox="0 0 370 500" preserveAspectRatio="none"><defs>' +
        '<pattern id="pubV" width="46" height="46" patternUnits="userSpaceOnUse"><rect width="46" height="46" fill="#1b1f33"/>' + gente + '</pattern>' +
        '<linearGradient id="sombraT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".65"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>' +
        '<radialGradient id="foco"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="#fff6c0" stop-opacity=".45"/><stop offset="1" stop-color="#fff6c0" stop-opacity="0"/></radialGradient></defs>' +
        '<rect width="370" height="500" rx="14" fill="#0a0d18"/>' +
        '<polygon points="10,8 360,8 328,46 42,46" fill="url(#pubV)"/><polygon points="10,492 360,492 328,454 42,454" fill="url(#pubV)"/>' +
        '<polygon points="8,10 44,46 44,454 8,490" fill="url(#pubV)"/><polygon points="362,10 326,46 326,454 362,490" fill="url(#pubV)"/>' +
        '<polygon points="10,8 360,8 328,46 42,46" fill="url(#sombraT)" opacity=".8"/>' +
        '<g stroke="#000" stroke-opacity=".35" stroke-width=".8"><line x1="10" y1="8" x2="42" y2="46"/><line x1="360" y1="8" x2="328" y2="46"/><line x1="10" y1="492" x2="42" y2="454"/><line x1="360" y1="492" x2="328" y2="454"/></g>' +
        '<rect x="44" y="46" width="282" height="408" fill="#c9ced8"/>' + carteles +
        '<rect x="51" y="53" width="268" height="394" fill="#1f6b2e"/>' + rayas +
        '<g ' + L + '><rect x="52" y="55" width="266" height="390"/><line x1="52" y1="250" x2="318" y2="250"/><circle cx="185" cy="250" r="36"/>' +
        '<rect x="106" y="55" width="158" height="61"/><rect x="149" y="55" width="72" height="20"/><path d="M155 116 A36 36 0 0 0 215 116"/>' +
        '<rect x="106" y="384" width="158" height="61"/><rect x="149" y="425" width="72" height="20"/><path d="M155 384 A36 36 0 0 1 215 384"/>' +
        '<path d="M52 63 A8 8 0 0 0 60 55"/><path d="M310 55 A8 8 0 0 0 318 63"/><path d="M52 437 A8 8 0 0 1 60 445"/><path d="M310 445 A8 8 0 0 1 318 437"/></g>' +
        '<g fill="#fff"><circle cx="185" cy="250" r="2.4"/><circle cx="185" cy="96" r="2.2"/><circle cx="185" cy="404" r="2.2"/></g>' +
        '<g fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="1.4"><rect x="165" y="44" width="40" height="11"/><rect x="165" y="445" width="40" height="11"/></g>' +
        '<g fill="url(#foco)"><circle cx="22" cy="22" r="26"/><circle cx="348" cy="22" r="26"/><circle cx="22" cy="478" r="26"/><circle cx="348" cy="478" r="26"/></g></svg>';
      return _estadio;
    }
    // Camiseta en SVG (el arquero lleva otra distinta)
    function camisetaSVG(pos, estado, texto) {
      const arq = pos === "ARQ";
      const cuerpo = estado === "vacio" ? "rgba(255,255,255,.16)" : (arq ? "#f2c100" : "#1e6fe0");
      const manga = estado === "vacio" ? "rgba(255,255,255,.1)" : (arq ? "#1a1a1a" : "#ffffff");
      const trazo = estado === "vacio" ? '#fff" stroke-dasharray="5 4' : (estado === "activo" ? "#ffd700" : "#0b1b3a");
      const ct = estado === "vacio" ? "#fff" : (arq ? "#111" : "#fff");
      const raya = estado === "lleno" ? '<rect x="26" y="70" width="48" height="5" fill="' + (arq ? "#1a1a1a" : "#ffffff") + '" opacity=".85"/>' : "";
      return '<svg class="cam" viewBox="0 0 100 100"><polygon points="30,12 10,24 2,46 18,52 26,40" fill="' + manga + '" stroke="' + trazo + '" stroke-width="3" stroke-linejoin="round"/>' +
        '<polygon points="70,12 90,24 98,46 82,52 74,40" fill="' + manga + '" stroke="' + trazo + '" stroke-width="3" stroke-linejoin="round"/>' +
        '<path d="M30 12 Q50 26 70 12 L74 40 L74 92 Q50 99 26 92 L26 40 Z" fill="' + cuerpo + '" stroke="' + trazo + '" stroke-width="3" stroke-linejoin="round"/>' + raya +
        '<path d="M38 12.5 Q50 24 62 12.5" fill="none" stroke="' + (estado === "vacio" ? "#fff" : (arq ? "#1a1a1a" : "#fff")) + '" stroke-width="3.5"/>' +
        '<text x="50" y="' + (estado === "vacio" ? 62 : 58) + '" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="' + (texto.length > 2 ? 24 : 32) + '" fill="' + ct + '">' + texto + "</text></svg>";
    }

    function dibujarCancha() {
      const cancha = el("cancha");
      let total = 0, cantidad = 0, h = estadioSVG() + '<div class="campo">';
      slots.forEach(function (s, i) {
        const act = i === slotActivo, j = s.jugador;
        const estado = j ? "lleno" : (act ? "activo" : "vacio");
        if (j) { total = total + j.nivel; cantidad = cantidad + 1; }
        const partes = j ? j.nombre.split(" ") : [];
        h += '<div class="puesto ' + estado + (j ? " lleno" : "") + (act ? " activo" : "") + '" data-i="' + i + '" style="left:' + s.x + "%;top:" + s.y + '%">' +
          camisetaSVG(s.pos, estado, j ? String(j.nivel) : s.pos) + (j ? '<span class="eti">' + esc(partes[partes.length - 1]) + "</span>" : "") + "</div>";
      });
      cancha.innerHTML = h + "</div>";
      Array.prototype.forEach.call(cancha.querySelectorAll(".puesto"), function (d) { d.onclick = function () { elegirPuesto(+d.getAttribute("data-i")); }; });
      const d = TT[ajustes.idioma];
      el("total").textContent = cantidad === slots.length
        ? d.completo + " " + d.nivelTotal + ": " + total
        : d.jugadores + ": " + cantidad + "/" + slots.length + "  ·  " + d.nivelTotal + ": " + total;
      dibujarTabla();

function poner(a, v) {

// ===== Sorteo con suerte: todos pueden salir, pero los mejores (RELATIVO a su lista) salen más seguido =====
const C_FASE = { 1: 0.6, 2: 2.2, 3: 2.2, 4: 4.5 };   // cuánto pesa la suerte en cada ruleta (la de ligas casi pareja, la de jugadores la más fuerte)
function nivelDeOpcion(txt) {          // qué tan bueno es cada opción de la ruleta, según la fase
  const d = disponibles();
  if (fase === 4) { const j = d.filter(function (x) { return x.equipo === sel.equipo && x.nombre === txt; })[0]; return j ? j.nivel : 0; }
  let grupo;
  if (fase === 1) { grupo = d.filter(function (j) { return EQUIPOS[txt] && EQUIPOS[txt].indexOf(j.equipo) !== -1; }); }
  else if (fase === 2) { grupo = d.filter(function (j) { return j.equipo === txt; }); }
  else { grupo = d.filter(function (j) { return j.equipo === sel.equipo && j.nacionalidad === txt; }); }

  return niv[0];                                                                                                      // equipo / nacionalidad: su mejor jugador
}
function elegirConSuerte(k) {          // devuelve el índice ganador de "lista"
  const n = lista.length; if (n < 2) { return 0; }
  if (fase === 1) {                    // casilleros especiales: carta trampa (10 %) y Liga de Legendarios (6 % a 12 %, sube con la suerte)
    const iC = lista.indexOf(CARTA_ID), iL = lista.indexOf(LIGA_LEGENDARIOS);
    if (iC >= 0 && Math.random() < 0.10) { return iC; }
    if (iL >= 0 && Math.random() < 0.04 + 0.06 * Math.max(0, Math.min(1, k))) { return iL; }
    const resto = lista.map(function (x, i) { return i; }).filter(function (i) { return i !== iC && i !== iL; });

function elegirEntre(idx, k) {         // sorteo por percentil dentro de los índices dados

  const pct = []; let i = 0;
  while (i < n) { let j = i; while (j + 1 < n && v[orden[j + 1]] === v[orden[i]]) { j++; } const p = (i + j) / 2 / (n - 1); for (let q = i; q <= j; q++) { pct[orden[q]] = p; } i = j + 1; }
  const w = pct.map(function (p) { return Math.exp(C_FASE[fase] * k * (p - 0.5)); }), tot = w.reduce(function (a, b) { return a + b; }, 0);
  let r = Math.random() * tot; for (let m = 0; m < n; m++) { r -= w[m]; if (r <= 0) { return idx[m]; } }

}
function girar(pot, res) {             // pot: 0..1 (largo del giro) | res: resultado del penal { zona, res, k }

}
function terminarGiro(ganador) {
